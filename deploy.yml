- name: Auto Push and Deploy FinSight Project
  hosts: localhost
  become: false
  tasks:
    - name: Auto commit and push changes to GitHub
      shell: |
        git add .
        git commit -m "Auto commit from Ansible on $(date '+%Y-%m-%d_%H-%M-%S')" || true
        git push origin main
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main

    - name: Install backend dependencies
      shell: npm install
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/server

    - name: Install frontend dependencies
      shell: npm install
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/client

    - name: Stop existing backend process (if any)
      shell: pkill -f "npm run dev" || true

    - name: Start backend
      shell: nohup npm run dev > backend.log 2>&1 &
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/server

    - name: Start frontend
      shell: nohup npm run dev > frontend.log 2>&1 &
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/client
