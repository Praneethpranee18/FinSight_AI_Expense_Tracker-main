- name: Auto Push and Deploy FinSight Project
  hosts: localhost
  become: false
  tasks:
    - name: Auto commit and push changes to GitHub
      shell: |
        git add .
        git commit -m "Auto commit from Ansible on $(date '+%Y-%m-%d_%H-%M-%S')" || true
        git push origin main
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main

    - name: Install backend dependencies
      shell: npm install
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/server

    - name: Install frontend dependencies
      shell: npm install
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/client

    - name: Ensure old backend processes are stopped (safe)
      shell: |
        if pgrep -f "npm run dev" >/dev/null 2>&1; then
          pkill -f "npm run dev" || true
          sleep 1
          pgrep -f "npm run dev" >/dev/null 2>&1 && pkill -9 -f "npm run dev" || true
        fi
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main
      failed_when: false

    - name: Ensure old frontend processes are stopped (safe)
      shell: |
        if pgrep -f "vite" >/dev/null 2>&1 || pgrep -f "npm run dev" >/dev/null 2>&1; then
          pkill -f "vite" || true
          pkill -f "npm run dev" || true
          sleep 1
          pgrep -f "vite" >/dev/null 2>&1 && pkill -9 -f "vite" || true
          pgrep -f "npm run dev" >/dev/null 2>&1 && pkill -9 -f "npm run dev" || true
        fi
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main
      failed_when: false

    - name: Start backend (background)
      shell: |
        nohup npm run dev > /mnt/d/FinSight_AI_Expense_Tracker-main/server/backend.log 2>&1 &
        sleep 0.5
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/server
      async: 45
      poll: 0

    - name: Start frontend (background)
      shell: |
        nohup npm run dev > /mnt/d/FinSight_AI_Expense_Tracker-main/client/frontend.log 2>&1 &
        sleep 0.5
      args:
        chdir: /mnt/d/FinSight_AI_Expense_Tracker-main/client
      async: 45
      poll: 0